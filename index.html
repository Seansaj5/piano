<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woodshed</title>
<meta name="description" content="A practice room for piano: chords, key signatures, lead sheets, ear and reading drills, and an AI tutor that reads your sheet music.">
<meta name="theme-color" content="#0D0B09">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Woodshed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top" id="top">
  <a class="brand" href="#/today" aria-label="Woodshed home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--brass)"/><path d="M8 7h4.4v18H8zM13.8 7h4.4v18h-4.4zM19.6 7H24v18h-4.4z" fill="#FBF5E8"/><path d="M11 7h3.6v10.5H11zM17.2 7h3.6v10.5h-3.6z" fill="#14100B"/></svg>
    <span class="brand-name">Woodshed</span>
  </a>
  <div class="top-tools">
    <button type="button" class="chip-btn" id="timerBtn" aria-label="Practice timer"><span class="dot" aria-hidden="true"></span><span id="timerTxt">Start practice</span></button>
    <button type="button" class="chip-btn metro-mini" id="metroMini" aria-label="Metronome"><span class="tick" aria-hidden="true"></span><span id="metroMiniTxt">92</span></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#/today" data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
  <a href="#/piano" data-v="piano"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h17v14h-17zM8.2 5v14M12 5v14M15.8 5v14"/><path class="fill" d="M6.9 5h2.6v7.5H6.9zM14.5 5h2.6v7.5h-2.6z"/></svg><span>Piano</span></a>
  <a href="#/chords" data-v="chords"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM9.3 5v8.5M14.7 5v8.5M9.3 13.5V19M14.7 13.5V19" /></svg><span>Chords</span></a>
  <a href="#/keys" data-v="keys"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v5.3M12 15.2v5.3M3.5 12h5.3M15.2 12h5.3"/></svg><span>Keys</span></a>
  <a href="#/sheet" data-v="sheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3.5 3.5V20.5H6zM9 9h6M9 12.5h6M9 16h4"/></svg><span><span class="t-long">Lead sheets</span><span class="t-short">Sheets</span></span></a>
  <a href="#/train" data-v="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 14.6 9l6 .8-4.4 4.2 1.1 6-5.3-2.9L6.7 20l1.1-6L3.4 9.8l6-.8z"/></svg><span>Train</span></a>
  <a href="#/tools" data-v="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5h7L18 20.5H6zM12 16 16.5 6M7.4 12.5h9.2"/></svg><span>Tools</span></a>
</nav>

<main id="main">
  <section class="view" id="v-today" hidden></section>
  <section class="view" id="v-piano" hidden></section>
  <section class="view" id="v-chords" hidden></section>
  <section class="view" id="v-keys" hidden></section>
  <section class="view" id="v-sheet" hidden></section>
  <section class="view" id="v-train" hidden></section>
  <section class="view" id="v-tools" hidden></section>
</main>

<!-- Clef, the tutor -->
<button type="button" class="clef-fab" id="clefFab" aria-label="Ask Clef, the tutor">
  <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--brass)"/><g id="clefFabGlyph" fill="#14100B"></g></svg>
</button>
<aside class="clef" id="clef" hidden aria-label="Clef, the tutor">
  <div class="clef-head">
    <div class="clef-id"><span class="clef-badge" aria-hidden="true"><svg viewBox="0 0 40 40"><g id="clefHeadGlyph" fill="currentColor"></g></svg></span><div><b>Clef</b><small id="clefMode">Your practice tutor</small></div></div>
    <div class="clef-head-btns">
      <button type="button" class="icon-btn" id="clefNew" aria-label="New conversation" title="New conversation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="icon-btn" id="clefCfgBtn" aria-label="Tutor settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
      <button type="button" class="icon-btn" id="clefClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="clef-cfg" id="clefCfg" hidden></div>
  <div class="clef-log" id="clefLog" aria-live="polite"></div>
  <div class="clef-shot" id="clefShot" hidden></div>
  <form class="clef-in" id="clefForm" autocomplete="off">
    <input type="file" id="clefFile" accept="image/*" hidden>
    <button type="button" class="icon-btn cam" id="clefCam" aria-label="Add a photo of sheet music" title="Photo of sheet music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg></button>
    <textarea id="clefQ" rows="1" placeholder="Ask Clef anything…" aria-label="Message Clef"></textarea>
    <button type="submit" class="send" id="clefSend" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12.5 6.5 18 12l-5.5 5.5"/></svg></button>
  </form>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/theory.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/staff.js"></script>
<script src="js/audio.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/songs.js"></script>
<script src="js/app.js"></script>
<script src="js/view-chords.js"></script>
<script src="js/view-keys.js"></script>
<script src="js/view-sheet.js"></script>
<script src="js/view-train.js"></script>
<script src="js/view-play.js"></script>
<script src="js/tutor.js"></script>
<script>
  W.App.start();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
